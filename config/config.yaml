# =============================================================================
# Path roots
# -----------------------------------------------------------------------------
# Only these roots are machine-specific. Everything else is expressed relative
# to one of them with a prefix: cache: / reference: / legacy: / project:
# =============================================================================
paths:
  cache_root: "/data/c/yangyusheng_optimized/resource"
  reference_root: "/hugedata/YushengYang/AFdb"
  legacy_root: "/data/c/yangyusheng_optimized/AFdb_based_domain_extraction"
  project_root: "."

# =============================================================================
# External resources
# -----------------------------------------------------------------------------
# Pinned per role rather than globally: the legacy results were produced with
# different PomBase releases for different analyses (see README provenance).
# =============================================================================
resources:
  pombase:
    coding_release: "2026-06-01"
    features_release: "2026-06-01"
    gene_table: "project:resources/pombase/2026-06-01/gene_IDs_names_products.tsv"
    peptide_stats: "project:resources/pombase/2026-06-01/PeptideStats.tsv"
    gff3: "project:resources/pombase/2026-06-01/Schizosaccharomyces_pombe_all_chromosomes.gff3"
    features_gene_table: "project:resources/pombase/2026-06-01/gene_IDs_names_products.tsv"
    features_peptide_stats: "project:resources/pombase/2026-06-01/PeptideStats.tsv"
  uniprot:
    triangulation: "project:resources/uniprot/uniprot_triangulation_2026-06-01.tsv"
    resolution: "project:resources/uniprot/uniprot_resolution.tsv"
  ted:
    release: "zenodo13908086"
    filtered_dump: "reference:TED/ted_365m.domain_summary.cath.globularity.taxid.tsv"
    segmentation_dump: "reference:TED/ted_214m_per_chain_segmentation.tsv"
  ecod:
    release: "dpam_v5"
    dump: "reference:ECOD/af2_eukaryotes.dpam_v5.domains.txt"

# =============================================================================
# Datasets
# -----------------------------------------------------------------------------
# One entry per structure/PAE dataset. Keys are the dataset labels used by the
# registry and the legacy per-dataset rules; `version` is the provenance tag
# recorded in source_version and file names. Paths use the resource prefixes.
# =============================================================================
datasets:
  AFDB_v6:
    version: "v6"
    structure: "reference:UP000002485_284812_SCHPO_v6"
    pae: "reference:PAE/UP000002485_284812_SCHPO_v6"
  AFDB_v4:
    version: "AFDB_v4_20230708"
    structure: "reference:UP000002485_284812_SCHPO_v4"
    pae: "reference:PAE/UP000002485_284812_SCHPO_v4"
    gene_table: "project:resources/pombase/2023-07-01/gene_IDs_names_products.tsv"
    enabled: false
  LocalAF2_PomBaseDiffAFdb:
    version: "LocalAF2_PomBaseDiffAFdb_20240305"
    structure: "reference:predictions/LocalAF2_PomBaseDiffAFdb_20240305/structure"
    pae: "reference:predictions/LocalAF2_PomBaseDiffAFdb_20240305/pae"
    fasta: "reference:predictions/LocalAF2_PomBaseDiffAFdb_20240305/input_fasta"
    gene_table: "project:resources/pombase/2023-07-01/gene_IDs_names_products.tsv"
    enabled: false
  LocalAF2_DY47073Annotation: &local_af2_dy47073
    version: "LocalAF2_DY47073Annotation_20240904"
    structure: "reference:archive/0_raw_20261119/20240904_formated_results_vDulab2_noNaN/vDulab2"
    pae: "reference:archive/0_raw_20261119/20240904_formated_results_vDulab2_noNaN/PAE_files"
    gene_table: "project:resources/pombase/2023-07-01/gene_IDs_names_products.tsv"
    enabled: false
  AF3_LongProt:
    version: "AF3_LongProt_20241101"
    structure: "reference:predictions/AF3_LongProt_20241101/structure"
    pae: "reference:predictions/AF3_LongProt_20241101/pae"
    gene_table: "reference:archive/0_raw_20261119/20241101_AF3_output/AF3_gene_IDs_names_products.tsv"
    enabled: false
  DY47073_ProteinSubset:
    <<: *local_af2_dy47073
    protein_subset: "project:resources/dy47073/protein_subset.txt"

# =============================================================================
# Pipeline parameters
# =============================================================================
parameters:
  pae_power: 1.0
  pae_cutoff: 5.0
  resolution: 0.5
  plddt_threshold: 70.0
  merge_gap: 11
  confident_min_length: 50
  confident_merge_gap: 6
