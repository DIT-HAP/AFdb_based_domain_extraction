# =============================================================================
# Path roots
# -----------------------------------------------------------------------------
# Only these roots are machine-specific. Everything else is expressed relative
# to one of them with a prefix: cache: / reference: / legacy: / raw: / project:
# =============================================================================
paths:
  cache_root: "/data/c/yangyusheng_optimized/resource"
  reference_root: "/hugedata/YushengYang/AFdb"
  legacy_root: "/data/c/yangyusheng_optimized/AFdb_based_domain_extraction"
  raw_root: "/data/c/yangyusheng_optimized/AFdb_based_domain_extraction/data/0_raw"
  project_root: "."

# =============================================================================
# External resources
# -----------------------------------------------------------------------------
# Pinned per role rather than globally: the legacy results were produced with
# different PomBase releases for different analyses (see README provenance).
# =============================================================================
resources:
  pombase:
    coding_release: "2026-06-01"
    features_release: "2026-06-01"
    gene_table: "project:resources/pombase/2026-06-01/gene_IDs_names_products.tsv"
    peptide_stats: "project:resources/pombase/2026-06-01/PeptideStats.tsv"
    gff3: "project:resources/pombase/2026-06-01/Schizosaccharomyces_pombe_all_chromosomes.gff3"
    features_gene_table: "project:resources/pombase/2026-06-01/gene_IDs_names_products.tsv"
    features_peptide_stats: "project:resources/pombase/2026-06-01/PeptideStats.tsv"
  uniprot:
    triangulation: "project:resources/uniprot/uniprot_triangulation_2026-06-01.tsv"
    resolution: "project:resources/uniprot/uniprot_resolution.tsv"
  registry:
    afdb_dir: "reference:UP000002485_284812_SCHPO_v6"
    afdb_pae_dir: "reference:PAE/UP000002485_284812_SCHPO_v6"
    afdb_v4_dir: "reference:UP000002485_284812_SCHPO_v4"
    vdulab_structure_dir: "reference:predictions/LocalAF2_PomBaseDiffAFdb_20240305/structure"
    vdulab_fasta_dir: "reference:predictions/LocalAF2_PomBaseDiffAFdb_20240305/input_fasta"
    af3_structure_dir: "reference:predictions/AF3_LongProt_20241101/structure"
  ted:
    release: "zenodo13908086"
    filtered_dump: "reference:TED/ted_365m.domain_summary.cath.globularity.taxid.tsv"
    segmentation_dump: "reference:TED/ted_214m_per_chain_segmentation.tsv"
  ecod:
    release: "dpam_v5"
    dump: "reference:ECOD/af2_eukaryotes.dpam_v5.domains.txt"

# =============================================================================
# Pipeline parameters
# =============================================================================
parameters:
  pae_power: 1.0
  pae_cutoff: 5.0
  resolution: 0.5
  plddt_threshold: 70.0
  merge_gap: 11
  confident_min_length: 50
  confident_merge_gap: 6
